name: dogovor

# Весь бэкенд одной командой: docker compose up
# API и Swagger: http://localhost:8000/api/docs
# Логи контейнеров с ротацией: до трёх файлов по 10 МБ на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  logging: *logging
  image: dogovorilis-backend:${APP_VERSION:-dev}
  # .env необязателен: без него работают значения по умолчанию.
  # Из .env подтянутся и остальные переменные (SECRET_KEY, LLM_*, SMTP_* и т.д.).
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    APP_VERSION: ${APP_VERSION:-dev}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leaderhelp}:${POSTGRES_PASSWORD:-leaderhelp}@db:5432/${POSTGRES_DB:-leaderhelp}
    REDIS_URL: redis://redis:6379/0
    # DEV_MODE и DEMO_DATA по умолчанию пустые, локально их включает compose.override.yaml.
    DEMO_DATA: ${DEMO_DATA:-}
    DEMO_TEAM_EMAILS: ${DEMO_TEAM_EMAILS:-}
  depends_on:
    db:
      condition: service_healthy
    # Ждём, пока Redis отвечает на ping, а не просто запущен.
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leaderhelp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaderhelp}
      POSTGRES_DB: ${POSTGRES_DB:-leaderhelp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    logging: *logging
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    # Свой depends_on заменяет общий, поэтому Redis указан здесь явно.
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker", "worker", "-l", "info"]

  beat:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    # Свой depends_on заменяет общий, поэтому Redis указан здесь явно.
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]

volumes:
  pgdata:
